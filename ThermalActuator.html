<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Actuator</title>
  <style>
    html { scroll-behavior: smooth; }
body {
  font-family: sans-serif;
  margin: 0;
  line-height: 1.6;
}

/* Full-width Top Menu Bar (scrolls normally) */
nav {
  background: #f4f4f4;
  padding: 15px 0; /* Removed left/right padding here */
  border-bottom: 1px solid #ddd;
  margin-bottom: 30px;
}

.nav-inner {
  width: 100%; /* Matches .project */
  padding: 0 30px;   /* Matches .project */
  box-sizing: border-box;
}

.project {
  width: 100%; /* Widened from 800px to fit two columns comfortably */
  margin: 0;
  padding: 0 30px 30px;
  box-sizing: border-box;
}

/* Side-by-side layout on desktop */
.hero-layout {
  display: flex;
  gap: 0;
  align-items: flex-end; /* Aligns text to the bottom of the carousel */
  margin-bottom: 30px;
}

.hero-layout .carousel-container {
  flex: 0 0 50%;      /* Carousel takes ~58% of the width */
  width: 50%;   /* Prevents the scrollable track from breaking flexbox */
  min-width: 0;
  margin-bottom: 0;
}

.project-info {
  flex: 0 0 50%;        /* Text takes ~42% of the width */
  width: 50%;
  padding: 30px 30px;
  box-sizing; border-box;
}

.project-info h1 {
  margin-top: 0;  /* Aligns the title with the top edge of the carousel */
}
    
.project-info p:last-child {
  margin-bottom: 0; /* Removes default paragraph gap at the bottom */
}
/* Stack vertically on small screens */
    /* Mobile: Title/text on top, carousel below, video at bottom */
@media (max-width: 768px) {
  .hero-layout {
    flex-direction: column-reverse; /* Puts .project-info above the carousel */
    align-items: stretch;           /* Ensures full width on mobile */
  }
  
  .hero-layout .carousel-container,
  .project-info {
    flex: none;
    width: 100%;
  }

  .project-info {
    padding: 20px;
  }
}
    nav a { margin-right: 20px; text-decoration: none; color: #333; font-weight: bold; }
    nav a:hover { color: #0066cc; }
    img { max-width: 100%; height: auto; border-radius: 0; margin-bottom: 15px; }

/* --- IMAGE CAROUSEL STYLES (1280x1024 aspect ratio) --- */
.carousel-container {
  position: relative;
  margin-bottom: 24px;
  border-radius: 0;
  overflow: hidden;
}

.carousel-track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none; /* Firefox */
}

.carousel-track::-webkit-scrollbar {
  display: none; /* Chrome/Safari */
}

.carousel-slide {
  flex: 0 0 100%;
  scroll-snap-align: start;
}

    .carousel-slide img {
  width: 100%;
  aspect-ratio: 1280 / 1024;
  height: auto;
  object-fit: contain;
  background: #000;
  border-radius: 0; /* Sharp corners */
  display: block;
  margin-bottom: 0;
}

/* --- UNOBSTRUCTED HOVER & TAP BUTTONS --- */
.carousel-btn {
  position: absolute;
  top: 50%;
  z-index: 10;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: transparent;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
  -webkit-tap-highlight-color: transparent;
  outline: none;

  /* Hidden by default */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.prev-btn {
  left: 12px;
  transform: translate(-10px, -50%);
}

.next-btn {
  right: 12px;
  transform: translate(10px, -50%);
}

/* Single class controls visibility for BOTH desktop & mobile */
.carousel-container.show-controls .carousel-btn {
  opacity: 0.85;
  pointer-events: auto;
  transform: translate(0, -50%);
}

/* Direct pointer hover (desktop mouse only) */
@media (pointer: fine) {
  .carousel-btn:hover {
    opacity: 1;
  }
  .prev-btn:hover {
    transform: translate(-3px, -50%) scale(1.15);
  }
  .next-btn:hover {
    transform: translate(3px, -50%) scale(1.15);
  }
}

/* Finger press / click animation */
.carousel-btn:active {
  opacity: 1;
}
.prev-btn:active {
  transform: translate(-3px, -50%) scale(1.15);
}
.next-btn:active {
  transform: translate(3px, -50%) scale(1.15);
}

    /* --- RESPONSIVE 16:9 VIDEO WRAPPER --- */
.video-wrapper {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  border-radius: 0; /* Sharp corners */
  margin-bottom: 15px;
}
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- TOP MENU BAR -->
<nav>
  <div class="nav-inner">
    <a href="index.html">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#video">Video</a>
  </div>
</nav>

<div class="project" id="thermal-actuator">

  <!-- SIDE-BY-SIDE CONTAINER -->
  <div class="hero-layout">
    
    <!-- LEFT: IMAGE CAROUSEL -->
    <div class="carousel-container" id="gallery">
      <div class="carousel-track" id="thermal-actuator-track">
        <div class="carousel-slide"><img src="images/Takeout_area.jpg" alt="Takeout area" width="1240" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_75deg.jpg" alt="Takeout 75 degree view" width="1240" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_60deg.jpg" alt="Takeout 60 degree view" width="1240" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_45deg_design3.jpg" alt="Takeout 45 degree design 3" width="1240" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_45deg_design2.jpg" alt="Takeout 45 degree design 2" width="1240" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_CloseUp_design1.jpg" alt="Takeout close up design 1" width="1240" height="1024"></div>
      </div>
      <button class="carousel-btn prev-btn" onclick="moveSlide('thermal-actuator-track', -1)" aria-label="Previous slide">&#10094;</button>
      <button class="carousel-btn next-btn" onclick="moveSlide('thermal-actuator-track', 1)" aria-label="Next slide">&#10095;</button>
    </div>

    <!-- RIGHT: TEXT -->
    <div class="project-info">
      <h1>ThermalActuator</h1>
      <p>Short introduction to the ThermalActuator project.</p>
    </div>
    
  </div>

  <!-- BELOW: EMBEDDED YOUTUBE VIDEO -->
  <div class="video-wrapper" id="video">
    <iframe
      src="https://www.youtube.com/embed/VIDEO_ID"
      title="ThermalActuator Video"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

</div>
<script>
  function moveSlide(trackId, direction) {
    const track = document.getElementById(trackId);
    const slideWidth = track.clientWidth;
    const maxScroll = track.scrollWidth - slideWidth;

    // Wrap back to start if clicking "next" on the last slide
    if (direction > 0 && track.scrollLeft >= maxScroll - 5) {
      track.scrollTo({ left: 0, behavior: 'smooth' });
    } 
    // Wrap to end if clicking "prev" on the first slide
    else if (direction < 0 && track.scrollLeft <= 5) {
      track.scrollTo({ left: maxScroll, behavior: 'smooth' });
    } 
    else {
      track.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
    }

    if (document.activeElement instanceof HTMLElement) {
      document.activeElement.blur();
    }
  }

  document.querySelectorAll('.carousel-container').forEach(carousel => {
    const track = carousel.querySelector('.carousel-track');
    let hideTimeout;
    let autoSlideTimer;
    let resumeTimeout;

    // --- AUTO-SLIDE LOGIC ---
    const startAutoSlide = () => {
      clearInterval(autoSlideTimer);
      autoSlideTimer = setInterval(() => {
        const slideWidth = track.clientWidth;
        const maxScroll = track.scrollWidth - slideWidth;

        // Loop back to first slide at the end, otherwise advance 1 slide
        if (track.scrollLeft >= maxScroll - 5) {
          track.scrollTo({ left: 0, behavior: 'smooth' });
        } else {
          track.scrollBy({ left: slideWidth, behavior: 'smooth' });
        }
      }, 5000); // Slides every 5 seconds when idle
    };

    const pauseAutoSlide = () => {
      clearInterval(autoSlideTimer);
      clearTimeout(resumeTimeout);
    };

    // Start auto-sliding when page loads
    startAutoSlide();

    // --- DESKTOP MOUSE INTERACTION ---
    carousel.addEventListener('pointerenter', (e) => {
      if (e.pointerType === 'mouse') {
        carousel.classList.add('show-controls');
        pauseAutoSlide(); // Pause while user is inspecting/hovering
      }
    });

    carousel.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') {
        carousel.classList.remove('show-controls');
        startAutoSlide(); // Resume when mouse leaves
      }
    });

    // --- MOBILE TOUCH INTERACTION ---
    carousel.addEventListener('touchstart', () => {
      carousel.classList.add('show-controls');
      clearTimeout(hideTimeout);
      pauseAutoSlide(); // Pause while user is tapping/swiping

      // Hide arrows after 2 seconds
      hideTimeout = setTimeout(() => {
        carousel.classList.remove('show-controls');
      }, 2000);

      // Resume auto-sliding after 5 seconds of idle time
      resumeTimeout = setTimeout(() => {
        startAutoSlide();
      }, 5000);
    }, { passive: true });
  });
</script>
</body>
</html>
