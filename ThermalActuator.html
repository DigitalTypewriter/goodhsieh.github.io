<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Actuator</title>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }

    /* Top Menu Bar */
    nav { background: #f4f4f4; padding: 15px; border-radius: 8px; margin-bottom: 30px; }
    nav a { margin-right: 20px; text-decoration: none; color: #333; font-weight: bold; }
    nav a:hover { color: #0066cc; }

    img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; }
    .project { margin-bottom: 50px; padding-bottom: 30px; }

    /* Styling for the clickable "Read More" drawer */
    details { background: #f9f9f9; padding: 12px 16px; border-radius: 6px; border: 1px solid #ddd; margin-top: 15px; }
    summary { font-weight: bold; color: #0066cc; cursor: pointer; }
    summary:hover { text-decoration: underline; }
    .hidden-content { margin-top: 15px; }

/* --- IMAGE CAROUSEL STYLES (1280x1024 aspect ratio) --- */
.carousel-container {
  position: relative;
  margin-bottom: 24px;
  border-radius: 8px;
  overflow: hidden;
}

.carousel-track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none; /* Firefox */
}

.carousel-track::-webkit-scrollbar {
  display: none; /* Chrome/Safari */
}

.carousel-slide {
  flex: 0 0 100%;
  scroll-snap-align: start;
}

.carousel-slide img {
  width: 100%;
  aspect-ratio: 1280 / 1024;
  height: auto;
  object-fit: contain;
  background: #000;
  display: block;
  margin-bottom: 0;
}

/* --- UNOBSTRUCTED HOVER & TAP BUTTONS --- */
.carousel-btn {
  position: absolute;
  top: 50%;
  z-index: 10;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: transparent;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
  -webkit-tap-highlight-color: transparent;

  /* Hidden until user hovers (desktop) or taps (mobile) */
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
}

.prev-btn {
  left: 12px;
  transform: translate(-10px, -50%);
}

.next-btn {
  right: 12px;
  transform: translate(10px, -50%);
}

/* 1. Mobile tap-to-reveal (controlled strictly by the JS timer) */
.carousel-container.show-controls .carousel-btn {
  opacity: 0.85;
  pointer-events: auto;
  transform: translate(0, -50%);
}

/* 2. Desktop-only mouse hover (prevents sticky hover on phones) */
@media (hover: hover) {
  .carousel-container:hover .carousel-btn {
    opacity: 0.85;
    pointer-events: auto;
    transform: translate(0, -50%);
  }

  .carousel-btn:hover {
    opacity: 1 !important;
  }

  .prev-btn:hover {
    transform: translate(-3px, -50%) scale(1.15);
  }

  .next-btn:hover {
    transform: translate(3px, -50%) scale(1.15);
  }
}

/* 3. Finger press / click animation (works on both mobile and desktop) */
.carousel-btn:active {
  opacity: 1 !important;
}
.prev-btn:active {
  transform: translate(-3px, -50%) scale(1.15);
}
.next-btn:active {
  transform: translate(3px, -50%) scale(1.15);
}

    /* --- RESPONSIVE 16:9 VIDEO WRAPPER --- */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 aspect ratio */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- TOP MENU BAR -->
  <nav>
    <a href="index.html">Home</a>
    <a href="#gallery">Gallery</a>
    <a href="#video">Video</a>
    <a href="#details">Details</a>
  </nav>

  <!-- THERMAL ACTUATOR PROJECT -->
  <div class="project" id="thermal-actuator">
    <h1>Thermal Actuator</h1>
    <p>Short introduction to the ThermalActuator project.</p>

    <!-- 1. IMAGE CAROUSEL (1280x1024 px) -->
    <div class="carousel-container" id="gallery">
      <div class="carousel-track" id="thermal-actuator-track">
        <div class="carousel-slide"><img src="images/Takeout_area.jpg" alt="Takeout area" width="1280" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_75deg.jpg" alt="Takeout 75 degree view" width="1280" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_60deg.jpg" alt="Takeout 60 degree view" width="1280" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_45deg_design3.jpg" alt="Takeout 45 degree design 3" width="1280" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_45deg_design2.jpg" alt="Takeout 45 degree design 2" width="1280" height="1024"></div>
        <div class="carousel-slide"><img src="images/Takeout_CloseUp_design1.jpg" alt="Takeout close up design 1" width="1280" height="1024"></div>
      </div>
      <button class="carousel-btn prev-btn" onclick="moveSlide('thermal-actuator-track', -1)" aria-label="Previous slide">&#10094;</button>
      <button class="carousel-btn next-btn" onclick="moveSlide('thermal-actuator-track', 1)" aria-label="Next slide">&#10095;</button>
    </div>

    <!-- 2. EMBEDDED YOUTUBE VIDEO (Replace VIDEO_ID with your actual YouTube video ID) -->
    <div class="video-wrapper" id="video">
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="ThermalActuator Video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <!-- EXPANDABLE DETAILS DRAWER -->
    <details id="details">
      <summary>Read More &amp; View Case Study PDF</summary>
      <div class="hidden-content">
        <p>Detailed breakdown of the ThermalActuator project goes here.</p>
        <p><a href="docs/project2-notes.pdf" target="_blank">Open Case Study PDF &rarr;</a></p>
      </div>
    </details>
  </div>

<script>
  // 1. Your existing left/right click function
  function moveSlide(trackId, direction) {
    const track = document.getElementById(trackId);
    const slideWidth = track.clientWidth;
    track.scrollBy({ left: direction * slideWidth, behavior: 'smooth' });
  }

  // 2. Mobile tap-to-reveal animation (for all carousels on the page)
  document.querySelectorAll('.carousel-container').forEach(carousel => {
    let hideTimeout;

    carousel.addEventListener('touchstart', () => {
      carousel.classList.add('show-controls');
      clearTimeout(hideTimeout);

      hideTimeout = setTimeout(() => {
        carousel.classList.remove('show-controls');
      }, 1500);
    }, { passive: true });
  });
</script>
</body>
</html>
